name: Publishing

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: "yarn"
          node-version-file: ".nvmrc"
      - run: yarn
      - run: yarn run lib:build
      - run: yarn run demo:build
      - run: yarn run lint
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          retention-days: "1"
          path: ./dist

  unit:
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: "yarn"
          node-version-file: ".nvmrc"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ github.workspace }}/dist
      - run: yarn
      - run: yarn run lib:test

  e2e:
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: "yarn"
          node-version-file: ".nvmrc"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ github.workspace }}/dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn || yarn || yarn
      - run: yarn run e2e

  publish:
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          registry-url: "https://registry.npmjs.org"
          node-version-file: ".nvmrc"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ github.workspace }}/dist
      # Every push to master or develop reaches this job, but only a release commit changes
      # the version. Without this check the rest fail on npm's 403 for an existing version --
      # after a full build, unit and e2e cycle -- which reads as a broken pipeline rather than
      # as nothing to publish. Reads the built manifest rather than a source one, since that is
      # the file npm actually publishes.
      - name: Check whether this version is new
        id: version
        working-directory: ./dist/ng-recaptcha
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "spec=$NAME@$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already published; nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.new == 'true'
        working-directory: ./dist/ng-recaptcha
        run: npm publish --access public --tag ${{github.ref_name == 'master' && 'latest' || 'next' }}
